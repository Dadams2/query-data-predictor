[project]
name = "query-data-predictor"
version = "0.2.0"
description = "Destination-recovery benchmark and MDI scorer for anticipating analytical interest in exploratory data analysis"
readme = "README.md"
authors = [
    { name = "David Adams", email = "david@dadams2.com" }
]
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.5.0",
    "matplotlib>=3.10.1",
    "mlxtend>=0.23.4",
    "numpy>=2.0.0",
    "pandas>=2.2.3",
    "scikit-learn>=1.6.1",
    "scipy>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
