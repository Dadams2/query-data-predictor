services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_DATA_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_SESSION_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/backups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DATA_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
